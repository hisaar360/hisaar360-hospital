<div class="wrapper" [class.pos-layout]="(hideShell$ | async) === true">
  @if ((hideShell$ | async) === true) {
    <div class="pos-content">
      <router-outlet></router-outlet>
    </div>
  } @else {
    <div class="sidebar">
      <app-leftmenu></app-leftmenu>
    </div>
    <div class="layout-main">
      <app-header></app-header>
      <router-outlet></router-outlet>
    </div>
  }
</div>
