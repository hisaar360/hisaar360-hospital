<div class="hms-tour-offer" *ngIf="tutorialOffer && !tutorialActive">
  <div class="hms-tour-offer__card" role="dialog" aria-modal="true" [attr.aria-labelledby]="'hms-tour-offer-title-' + storageKey">
    <h3 [id]="'hms-tour-offer-title-' + storageKey">{{ offerTitle }}</h3>
    <p>{{ offerText }}</p>
    <div class="hms-tour-offer__actions">
      <button type="button" class="is-ghost" (click)="dismissOffer()">Skip for now</button>
      <button type="button" class="is-primary" (click)="startTutorial()">Start Tutorial</button>
    </div>
  </div>
</div>

<div class="hms-tour" *ngIf="tutorialActive">
  <div class="hms-tour__dim" (click)="skip()"></div>
  <div
    class="hms-tour__spot"
    *ngIf="tutorialRect as spot"
    [style.top.px]="spot.top"
    [style.left.px]="spot.left"
    [style.width.px]="spot.width"
    [style.height.px]="spot.height"
  ></div>
  <div class="hms-tour__card" [ngStyle]="tutorialCardStyle" *ngIf="activeStep as tip">
    <div class="hms-tour__meta">
      <span>{{ progressLabel }}</span>
      <button type="button" class="hms-tour__close" (click)="skip()" aria-label="Close tutorial">
        <i class="fa fa-times"></i>
      </button>
    </div>
    <h3>{{ tip.title }}</h3>
    <p>{{ tip.text }}</p>
    <div class="hms-tour__actions">
      <button type="button" (click)="skip()">Skip</button>
      <button type="button" (click)="prev()" [disabled]="tutorialStep === 0">Back</button>
      <button type="button" class="is-primary" (click)="next()">
        {{ tutorialStep >= steps.length - 1 ? 'Finish' : 'Next' }}
      </button>
    </div>
  </div>
</div>
