<div class="auth-main">
    <div class="auth_div vivify fadeIn">
        <div class="auth_brand">
            <a class="navbar-brand" href="#">
                <img src="assets/hisar1.png" class="brand-logo" alt="Hisaar360 Logo">
            </a>
        </div>

        <div class="auth_backlink">
            <a [routerLink]="'/login'"><i class="fa fa-arrow-left"></i> Back to Showcase</a>
        </div>

        <div class="card">
            <div class="header">
                <p class="lead" *ngIf="!ssoLoading">Login to your account</p>
                <p class="lead" *ngIf="ssoLoading">Signing you in…</p>
            </div>

            <div class="body">
                <div *ngIf="ssoLoading" class="text-center py-4">
                    <span class="spinner"></span>
                    <p class="mt-3 mb-0">Completing secure SSO login</p>
                </div>

                <form *ngIf="showLocalLoginForm && !ssoLoading" [formGroup]="loginForm" (ngSubmit)="onSubmit()"
                    class="form-auth-small">
                    <div class="form-group c_form_group">
                        <label for="email">Email or Username</label>
                        <input id="email" name="email" formControlName="email" type="email" class="form-control"
                            placeholder="Enter your email address" autocomplete="username" />
                    </div>

                    <div class="form-group c_form_group">
                        <label for="password">Password</label>
                        <div class="input-group flex">
                            <input id="password" name="password" autocomplete="current-password"
                                [type]="showNewPassword ? 'text' : 'password'" class="form-control password-input"
                                formControlName="password" placeholder="Enter your password" />
                            <div class="input-group-append">
                                <i (click)="togglePasswordVisibility('password')" class="fa"
                                    [ngClass]="{'fa-eye': !showNewPassword, 'fa-eye-slash': showNewPassword}"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group clearfix">
                        <label class="fancy-checkbox element-left">
                            <input type="checkbox" />
                            <span>Remember me</span>
                        </label>
                    </div>

                    <button type="submit"
                        class="btn btn-dark btn-lg btn-block d-flex justify-content-center align-items-center"
                        [disabled]="loading">
                        <span *ngIf="loading" class="spinner"></span>
                        {{ loading ? 'Logging in...' : 'LOGIN' }}
                    </button>

                    <div class="bottom mt-3">
                        <span class="helper-text m-b-10">
                            <i style="margin-right: 8px;" class="fa fa-lock"></i>
                            <a [routerLink]="'/forgot-password'">Forgot password?</a>
                        </span>
                    </div>
                </form>

                <div *ngIf="!showLocalLoginForm && !ssoLoading" class="text-center py-3">
                    <p class="mb-3">Redirecting to Hisaar360 login…</p>
                    <button type="button" class="btn btn-dark" (click)="authService.redirectToHostedLogin()">
                        Continue to login
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="animate_lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>
</div>
